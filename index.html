<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House of ROI</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://use.typekit.net/xjk1jkt.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --base: min(100vw, 1440px);
      --edge-gap: 120px;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
    }

    .stub {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: var(--edge-gap);
      gap: 64px;
    }

    @keyframes stubIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stub-logo {
      width: 15vw;
      height: auto;
      opacity: 0;
      animation: stubIn 1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .stub-text-group {
      --headline-size: clamp(22px, 7.5vw, 40px);
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--headline-size);
      width: 90vw;
    }

    .stub-headline {
      font-family: "futura-pt", sans-serif;
      font-weight: 300;
      font-style: normal;
      font-size: var(--headline-size);
      line-height: 100%;
      letter-spacing: 0.2em;
      color: #fafafa;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      animation: stubIn 1s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
    }

    .stub-tagline {
      font-family: "futura-pt", sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: calc(var(--headline-size) * 0.5);
      line-height: 100%;
      letter-spacing: 0.32em;
      color: #fafafa;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      animation: stubIn 1s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards;
    }

    .stub-socials {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--edge-gap);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      animation: stubIn 1s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
    }

    .stub-social {
      display: inline-flex;
      transition: opacity 0.2s ease;
    }

    .stub-social img {
      height: 17.6px;
      width: auto;
      display: block;
    }

    .stub-social--linkedin img {
      height: 19.36px;
    }

    .stub-social:hover {
      opacity: 0.6;
    }

    @media (max-width: 639px) {
      .stub-socials {
        bottom: calc(13vh + env(safe-area-inset-bottom, 0px));
      }
    }

    @media (min-width: 640px) {
      .stub-text-group {
        --headline-size: 36px;
        width: auto;
      }

      .stub-tagline {
        font-size: 23px;
      }
    }

    @media (min-width: 768px) {
      .stub-logo {
        width: calc(var(--base) * 5 / 100);
      }

      .stub-text-group {
        --headline-size: 40px;
      }

      .stub-tagline {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="stub">
    <img class="stub-logo" src="assets/logo_house_of_roi.svg" alt="House of ROI">
    <div class="stub-text-group">
      <p class="stub-headline">Coming soon</p>
      <p class="stub-tagline">by invitation only</p>
    </div>
  </div>
  <div class="stub-socials">
    <a class="stub-social" href="mailto:inquiries@thehouseofroi.com" aria-label="Email">
      <img src="images/email.svg" alt="Email">
    </a>
    <a class="stub-social stub-social--linkedin" href="https://www.linkedin.com/company/the-house-of-roi" target="_blank" rel="noopener" aria-label="LinkedIn">
      <img src="images/linkedin-svgrepo-com.svg" alt="LinkedIn">
    </a>
  </div>
</body>
</html>
